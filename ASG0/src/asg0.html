<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ASG0 - Vector Operations</title>
    <link rel="icon" href="data:,">
    <style>
      body {
        font-family: Arial, sans-serif;
      }

      canvas {
        background-color: black;
        display: block;
        margin-bottom: 15px;
      }

      .controls {
        margin-bottom: 10px;
      }

      label {
        margin-right: 6px;
      }

      input, select, button {
        margin-right: 10px;
        margin-bottom: 10px;
      }
    </style>
  </head>

  <body onload="main()">
    <h1>ASG0 - Vector Operations</h1>

    <p>Aleksandar Videv</p>
    <p>avidev@ucsc.edu</p>
    <p>Notes to Grader: None.</p>

    <canvas id="example" width="400" height="400">
      Please use a browser that supports canvas
    </canvas>

    <div class="controls">
      <label for="v1x">v1 x:</label>
      <input type="number" id="v1x" value="2.25" step="any">

      <label for="v1y">v1 y:</label>
      <input type="number" id="v1y" value="2.25" step="any">
    </div>

    <div class="controls">
      <label for="v2x">v2 x:</label>
      <input type="number" id="v2x" value="1.0" step="any">

      <label for="v2y">v2 y:</label>
      <input type="number" id="v2y" value="1.0" step="any">
    </div>

    <div class="controls">
      <button onclick="handleDrawEvent()">Draw</button>
    </div>

    <div class="controls">
      <label for="operation">Operation:</label>
      <select id="operation">
        <option value="add">Add</option>
        <option value="sub">Subtract</option>
        <option value="mul">Multiply</option>
        <option value="div">Divide</option>
        <option value="magnitude">Magnitude</option>
        <option value="normalize">Normalize</option>
        <option value="angle">Angle between</option>
        <option value="area">Area</option>
      </select>

      <label for="scalar">Scalar:</label>
      <input type="number" id="scalar" value="2" step="any">

      <button onclick="handleDrawOperationEvent()">Draw Operation</button>
    </div>

    <script src="../lib/cuon-matrix-cse160.js"></script>
    <script src="asg0.js"></script>
  </body>
</html>
